[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otel-cardinality-lab"
version = "0.1.0"
description = "Preflight OpenTelemetry metric cardinality budgets before they hit a backend."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brandon Wise" }]
keywords = ["opentelemetry", "observability", "metrics", "cardinality", "sre"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: System :: Monitoring",
]

[project.scripts]
otel-cardinality-lab = "otel_cardinality_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
